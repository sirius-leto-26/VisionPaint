name: Update Diagrams

on:
  push:
    paths:
      - 'docs/diagrams/raw/**/*.mmd'
      - 'docs/*.md'
      - 'README.md'

jobs:
  update-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Wrap Mermaid files
        uses: sugurutakahashi-1234/mermaid-markdown-wrap@v1.2.2
        with:
          input: "docs/diagrams/raw/**/*.mmd"
          out-dir: docs/diagrams

      - name: Process includes
        uses: devlooped/actions-includes@v1
        with:
          include-files: |
            docs/architecture.md
            docs/contracts.md
            README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update diagrams"
          file_pattern: |
            docs/diagrams/*.md
            docs/architecture.md
            docs/contracts.md
            README.md
